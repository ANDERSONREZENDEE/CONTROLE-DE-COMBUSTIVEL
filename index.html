<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Combustível - WM Construções</title>
    
    <!-- Configuração para PWA (Funcionamento Offline e Ícone) -->
    <link rel="manifest" href="manifest.json.txt">
    <link rel="icon" href="icone.jpg.jpg">
    <link rel="apple-touch-icon" href="icone.jpg.jpg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #e0e0e0; 
            padding: 10px; 
            margin: 0;
        }
        /* Borda metade preta e metade LARANJA */
        .app-border {
            background: linear-gradient(135deg, #000000 50%, #FF8C00 50%);
            padding: 8px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .container { 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
        }
        
        /* Logo no topo */
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { max-width: 150px; height: auto; }
        
        h2 { text-align: center; color: #333; font-size: 18px; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
        }
        
        /* Animação para piscar campos obrigatórios vazios */
        @keyframes piscarErro {
            0% { border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.8); background-color: #ffe6e6; }
            50% { border-color: transparent; box-shadow: none; background-color: #fff; }
            100% { border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.8); background-color: #ffe6e6; }
        }
        .erro-piscar {
            animation: piscarErro 1s infinite;
        }

        .btn { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        .btn-primary { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ffc107; color: #333; }
        .btn-danger { background-color: #dc3545; }
        .btn-info { background-color: #17a2b8; }
        
        .password-container { position: relative; }
        .toggle-password { position: absolute; right: 10px; top: 35px; cursor: pointer; color: #666; font-size: 18px; }
        .hidden { display: none !important; }
        input[type="file"] { padding: 5px; background: #f8f9fa; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="app-border">
    <div class="container">
        <div class="logo-container">
            <img src="LOGOTIPO.jpg" alt="WM Construções" onerror="this.style.display='none'">
        </div>
        <h2>Acesso do Controlador</h2>
        <div class="form-group password-container">
            <label for="senhaAcesso">Senha de Acesso:</label>
            <input type="password" id="senhaAcesso" placeholder="Digite a senha" oninput="handlePasswordInput('senhaAcesso', 'eyeIconLogin')">
            <!-- Olhinho fechado por padrão, abre ao digitar -->
            <i class="fa-solid fa-eye-slash toggle-password" id="eyeIconLogin" onclick="togglePasswordVisibility('senhaAcesso')"></i>
        </div>
        <button type="button" class="btn btn-primary" onclick="entrarNoApp()">ENTRAR NO SISTEMA</button>
    </div>
</div>

<!-- APLICATIVO PRINCIPAL -->
<div id="telaPrincipal" class="app-border hidden">
    <div class="container" id="areaExportacao">
        <h2>CONTROLE DE FROTA E INSUMOS</h2>
        <hr>
        <!-- Retirado o onsubmit padrão para controlar a validação manual via JS -->
        <form id="formLançamento" novalidate>
            
            <div class="form-group">
                <label for="data">Data do Lançamento:</label>
                <input type="date" id="data" required>
            </div>

            <!-- Dados do Motorista -->
            <div class="form-group">
                <label for="nomeMotorista">Nome do Motorista:</label>
                <input type="text" id="nomeMotorista" placeholder="Nome completo" required>
            </div>
            <div class="form-group">
                <label for="cpfMotorista">CPF do Motorista:</label>
                <input type="text" id="cpfMotorista" placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascaraCPF(this)" required>
            </div>

            <!-- Dados do Veículo -->
            <div class="form-group">
                <label for="placa">Placa do Veículo:</label>
                <input type="text" id="placa" placeholder="ABC-1234" maxlength="8" style="text-transform: uppercase;" onblur="buscarVeiculoPorPlaca()" required>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="modeloVeiculo">Modelo:</label>
                    <input type="text" id="modeloVeiculo" placeholder="Ex: Caminhão..." required>
                </div>
                <div class="form-group">
                    <label for="anoVeiculo">Ano:</label>
                    <input type="number" id="anoVeiculo" placeholder="Ex: 2020">
                </div>
            </div>

            <!-- Insumos -->
            <div class="form-group">
                <label for="tipoItem">Tipo de Combustível / Produto:</label>
                <select id="tipoItem" onchange="verificarTipoItem()" required>
                    <option value="">Selecione...</option>
                    <option value="DIESEL S10">Diesel S10</option>
                    <option value="DIESEL S500">Diesel S500</option>
                    <option value="GASOLINA">Gasolina</option>
                    <option value="ETANOL">Etanol</option>
                    <option value="ARLA 32">Arla 32</option>
                    <option value="ADITIVO RADIADOR">Aditivo para Radiador</option>
                    <option value="OLEO 2T">Óleo 2T</option>
                    <option value="OLEO LUBRIFICANTE">Óleo Lubrificante</option>
                    <option value="AUTOPECAS">Autopeças</option>
                </select>
            </div>

            <div class="form-group hidden" id="divDescricaoPeca">
                <label for="descricaoPeca">Descrição da Peça (Obrigatório para Autopeças):</label>
                <textarea id="descricaoPeca" rows="2" placeholder="Descreva a peça adquirida..."></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="quantidade">Qtd (Litros/Unid):</label>
                    <input type="number" id="quantidade" step="0.01" oninput="calcularTotal()" required>
                </div>
                <div class="form-group">
                    <label for="valorUnitario">Valor Unitário (R$):</label>
                    <input type="number" id="valorUnitario" step="0.01" oninput="calcularTotal()" required>
                </div>
            </div>

            <div class="form-group">
                <label for="valorTotal">Valor Total (R$):</label>
                <input type="number" id="valorTotal" step="0.01" placeholder="Calculado automático" readonly required>
            </div>

            <div class="form-group">
                <label for="cupomFiscal">Nº do Cupom Fiscal:</label>
                <input type="text" id="cupomFiscal" placeholder="Número da nota/cupom" required>
            </div>

            <div class="form-group">
                <label for="hodometro">Hodômetro / Horímetro:</label>
                <input type="number" id="hodometro" required>
            </div>

            <div class="form-group">
                <label for="fotoHodo">Foto do Hodômetro/Horímetro (Obrigatório):</label>
                <input type="file" id="fotoHodo" accept="image/*" capture="environment" required>
            </div>

            <div class="form-group">
                <label for="fotoCupom">Foto do Cupom Fiscal (Obrigatório):</label>
                <input type="file" id="fotoCupom" accept="image/*" capture="environment" required>
            </div>

            <button type="button" class="btn btn-success" onclick="validarESalvar()"><i class="fa-solid fa-save"></i> SALVAR LANÇAMENTO</button>
        </form>

        <hr>
        <button type="button" class="btn btn-info" onclick="verLancamentos()"><i class="fa-solid fa-list"></i> VER LANÇAMENTOS</button>
        <button type="button" class="btn btn-warning" onclick="gerarPDF()"><i class="fa-solid fa-file-pdf"></i> COMPARTILHAR PDF</button>
        <button type="button" class="btn btn-danger" onclick="sairESalvar()"><i class="fa-solid fa-right-from-bracket"></i> SAIR E SALVAR</button>
    </div>
</div>

<script>
    // Registro do Service Worker para funcionar OFFLINE
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado com sucesso (Modo Offline Ativo).'))
                .catch(err => console.log('Falha ao registrar Service Worker.', err));
        });
    }

    let lancamentosSessao = [];

    // Comportamento da Senha (Olho fechado -> Digita -> Olho aberto)
    function handlePasswordInput(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        
        if (input.value.length > 0) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }

    function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }

    function entrarNoApp() {
        const senha = document.getElementById('senhaAcesso').value;
        if (senha.trim() !== "") {
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('telaPrincipal').classList.remove('hidden');
            document.getElementById('data').valueAsDate = new Date();
        } else {
            alert("Por favor, insira a senha do controlador.");
        }
    }

    // Máscara de CPF
    function aplicarMascaraCPF(input) {
        let value = input.value.replace(/\D/g, "");
        if (value.length > 3) value = value.replace(/^(\d{3})(\d)/, "$1.$2");
        if (value.length > 6) value = value.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
        if (value.length > 9) value = value.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
        input.value = value;
    }

    // Função Simulada para buscar veículo por placa (Pode cadastrar a frota aqui)
    function buscarVeiculoPorPlaca() {
        const placa = document.getElementById('placa').value.toUpperCase().replace("-", "");
        const modeloInput = document.getElementById('modeloVeiculo');
        const anoInput = document.getElementById('anoVeiculo');

        // SIMULAÇÃO DE FROTA INTERNA (Adicione as placas aqui)
        const frota = {
            "ABC1234": { modelo: "Caminhão Basculante Volvo", ano: "2020" },
            "QWE9876": { modelo: "Escavadeira CAT", ano: "2018" },
            "WMX0001": { modelo: "Fiat Strada CD", ano: "2022" }
        };

        if (placa.length >= 7) {
            if (frota[placa]) {
                modeloInput.value = frota[placa].modelo;
                anoInput.value = frota[placa].ano;
            } else {
                // Deixa livre para o controlador digitar manualmente se não achar
            }
        }
    }

    // Calcular Valor Total Automático
    function calcularTotal() {
        const qtd = parseFloat(document.getElementById('quantidade').value) || 0;
        const vlrUnit = parseFloat(document.getElementById('valorUnitario').value) || 0;
        document.getElementById('valorTotal').value = (qtd * vlrUnit).toFixed(2);
    }

    function verificarTipoItem() {
        const tipo = document.getElementById('tipoItem').value;
        const divDescricao = document.getElementById('divDescricaoPeca');
        const inputDescricao = document.getElementById('descricaoPeca');
        
        if (tipo === 'AUTOPECAS') {
            divDescricao.classList.remove('hidden');
            inputDescricao.required = true;
        } else {
            divDescricao.classList.add('hidden');
            inputDescricao.required = false;
            inputDescricao.value = "";
        }
    }

    // Validação com Efeito Piscar e Salvamento
    function validarESalvar() {
        const form = document.getElementById('formLançamento');
        const inputs = form.querySelectorAll('input[required], select[required], textarea[required]');
        let formValido = true;

        inputs.forEach(input => {
            if (!input.value.trim()) {
                input.classList.add('erro-piscar'); // Aplica a animação
                formValido = false;
                
                // Remove a animação assim que o usuário começar a preencher
                input.addEventListener('input', function removerErro() {
                    input.classList.remove('erro-piscar');
                    input.removeEventListener('input', removerErro);
                });
            } else {
                input.classList.remove('erro-piscar');
            }
        });

        if (!formValido) {
            alert("Atenção! Preencha os campos obrigatórios que estão piscando em vermelho.");
            return;
        }

        // Se estiver válido, procede com o salvamento
        const lancamento = {
            data: document.getElementById('data').value,
            motorista: document.getElementById('nomeMotorista').value,
            cpf: document.getElementById('cpfMotorista').value,
            placa: document.getElementById('placa').value,
            tipo: document.getElementById('tipoItem').value,
            cupom: document.getElementById('cupomFiscal').value,
            total: document.getElementById('valorTotal').value
        };

        lancamentosSessao.push(lancamento);
        alert("Lançamento registrado com sucesso!");

        // Limpeza dos campos principais para forçar escolha no próximo
        document.getElementById('tipoItem').value = "";
        document.getElementById('quantidade').value = "";
        document.getElementById('valorUnitario').value = "";
        document.getElementById('valorTotal').value = "";
        document.getElementById('cupomFiscal').value = "";
        document.getElementById('hodometro').value = "";
        document.getElementById('fotoHodo').value = "";
        document.getElementById('fotoCupom').value = "";
        verificarTipoItem();
    }

    function verLancamentos() {
        if (lancamentosSessao.length === 0) {
            alert("Nenhum lançamento registrado nesta sessão.");
            return;
        }
        let relatorio = "LANÇAMENTOS SALVOS:\n\n";
        lancamentosSessao.forEach((item, index) => {
            relatorio += `${index + 1}. Placa: ${item.placa} - Mot: ${item.motorista} - Item: ${item.tipo} - R$ ${item.total}\n`;
        });
        alert(relatorio);
    }

    function gerarPDF() {
        const elemento = document.getElementById('areaExportacao');
        const opcoes = {
            margin:       10,
            filename:     'Lancamentos_WM.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        const botoes = elemento.querySelectorAll('button');
        botoes.forEach(btn => btn.style.display = 'none');

        html2pdf().set(opcoes).from(elemento).save().then(() => {
            botoes.forEach(btn => btn.style.display = 'block');
        });
    }

    function sairESalvar() {
        if(confirm("Deseja realmente sair e bloquear o aplicativo?")) {
            document.getElementById('senhaAcesso').value = "";
            handlePasswordInput('senhaAcesso', 'eyeIconLogin');
            document.getElementById('telaPrincipal').classList.add('hidden');
            document.getElementById('telaLogin').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
