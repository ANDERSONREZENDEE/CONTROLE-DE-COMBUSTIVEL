<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Frota - WM Construções</title>
    
    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json.txt">
    <link rel="icon" href="icone.jpg.jpg">
    <link rel="apple-touch-icon" href="icone.jpg.jpg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* Estilo Geral - Fundo Preto na Tela de Senha */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #000000; 
            padding: 10px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Borda metade preta e metade LARANJA nos cantos */
        .app-border {
            background: linear-gradient(135deg, #000000 50%, #FF8C00 50%);
            padding: 8px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.3);
            box-sizing: border-box;
        }

        .container { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 8px; 
        }

        /* Ícone do App na Tela de Login */
        .app-icon-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .app-icon-header img {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid #FF8C00;
        }

        h2 { text-align: center; color: #333; font-size: 17px; text-transform: uppercase; margin-top: 0; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #444; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        /* Animação para piscar campos obrigatórios */
        @keyframes piscarErro {
            0% { border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.6); background-color: #fff0f0; }
            50% { border-color: #ccc; box-shadow: none; background-color: #fff; }
            100% { border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.6); background-color: #fff0f0; }
        }
        .erro-piscar { animation: piscarErro 0.8s infinite; }

        .btn { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px;
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            font-size: 14px;
        }
        .btn-primary { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ffc107; color: #333; }
        .btn-danger { background-color: #dc3545; }
        .btn-info { background-color: #17a2b8; }
        
        .password-container { position: relative; }
        .toggle-password { position: absolute; right: 10px; top: 32px; cursor: pointer; color: #666; font-size: 18px; }
        .hidden { display: none !important; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="app-border">
    <div class="container">
        <div class="app-icon-header">
            <img src="icone.jpg.jpg" alt="WM Frota">
        </div>
        <h2>Acesso do Controlador</h2>
        <div class="form-group password-container">
            <label for="senhaAcesso">Senha de Acesso:</label>
            <input type="password" id="senhaAcesso" placeholder="Digite a senha" oninput="handlePasswordInput('senhaAcesso', 'eyeIconLogin')">
            <i class="fa-solid fa-eye-slash toggle-password" id="eyeIconLogin" onclick="togglePasswordVisibility('senhaAcesso')"></i>
        </div>
        <button type="button" class="btn btn-primary" onclick="entrarNoApp()">ENTRAR NO SISTEMA</button>
    </div>
</div>

<!-- APLICATIVO PRINCIPAL -->
<div id="telaPrincipal" class="app-border hidden">
    <div class="container" id="areaExportacao">
        <div style="text-align: center; margin-bottom: 10px;">
            <img src="LOGOTIPO.jpg" style="max-width: 120px; height: auto;" onerror="this.style.display='none'">
        </div>
        <h2>CONTROLE DE FROTA E INSUMOS</h2>
        <hr>
        <form id="formLançamento" novalidate>
            <div class="form-group">
                <label for="data">Data do Lançamento:</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group">
                <label for="nomeMotorista">Nome do Motorista:</label>
                <input type="text" id="nomeMotorista" placeholder="Nome completo" required>
            </div>

            <div class="form-group">
                <label for="cpfMotorista">CPF do Motorista:</label>
                <input type="text" id="cpfMotorista" placeholder="000.000.000-00" maxlength="14" oninput="aplicarMascaraCPF(this)" required>
            </div>

            <div class="form-group">
                <label for="placa">Placa do Veículo:</label>
                <input type="text" id="placa" placeholder="ABC-1234" maxlength="8" style="text-transform: uppercase;" onblur="buscarVeiculoPorPlaca()" required>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="modeloVeiculo">Modelo:</label>
                    <input type="text" id="modeloVeiculo" placeholder="Modelo" required>
                </div>
                <div class="form-group">
                    <label for="anoVeiculo">Ano:</label>
                    <input type="number" id="anoVeiculo" placeholder="Ano">
                </div>
            </div>

            <div class="form-group">
                <label for="tipoItem">Tipo de Combustível / Produto:</label>
                <select id="tipoItem" onchange="verificarTipoItem()" required>
                    <option value="">Selecione...</option>
                    <option value="DIESEL S10">Diesel S10</option>
                    <option value="DIESEL S500">Diesel S500</option>
                    <option value="GASOLINA">Gasolina</option>
                    <option value="ETANOL">Etanol</option>
                    <option value="ARLA 32">Arla 32</option>
                    <option value="ADITIVO RADIADOR">Aditivo para Radiador</option>
                    <option value="OLEO 2T">Óleo 2T</option>
                    <option value="OLEO LUBRIFICANTE">Óleo Lubrificante</option>
                    <option value="AUTOPECAS">Autopeças</option>
                </select>
            </div>

            <div class="form-group hidden" id="divDescricaoPeca">
                <label for="descricaoPeca">Descrição da Peça:</label>
                <textarea id="descricaoPeca" rows="2" placeholder="Qual peça foi comprada?"></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="quantidade">Qtd (Litros/Un):</label>
                    <input type="number" id="quantidade" step="0.01" oninput="calcularTotal()" required>
                </div>
                <div class="form-group">
                    <label for="valorUnitario">Vlr Unitário:</label>
                    <input type="number" id="valorUnitario" step="0.01" oninput="calcularTotal()" required>
                </div>
            </div>

            <div class="form-group">
                <label for="valorTotal">Valor Total (R$):</label>
                <input type="number" id="valorTotal" step="0.01" readonly required style="background: #f9f9f9; font-weight: bold;">
            </div>

            <div class="form-group">
                <label for="cupomFiscal">Nº do Cupom Fiscal:</label>
                <input type="text" id="cupomFiscal" placeholder="Número da Nota" required>
            </div>

            <div class="form-group">
                <label for="hodometro">Hodômetro / Horímetro:</label>
                <input type="number" id="hodometro" required>
            </div>

            <div class="form-group">
                <label for="fotoHodo">Foto Hodômetro (Obrigatório):</label>
                <input type="file" id="fotoHodo" accept="image/*" capture="environment" required>
            </div>

            <div class="form-group">
                <label for="fotoCupom">Foto Cupom (Obrigatório):</label>
                <input type="file" id="fotoCupom" accept="image/*" capture="environment" required>
            </div>

            <button type="button" class="btn btn-success" onclick="validarESalvar()"><i class="fa-solid fa-save"></i> SALVAR LANÇAMENTO</button>
        </form>

        <hr>
        <button type="button" class="btn btn-info" onclick="verLancamentos()"><i class="fa-solid fa-list"></i> VER LANÇAMENTOS</button>
        <button type="button" class="btn btn-warning" onclick="gerarPDF()"><i class="fa-solid fa-file-pdf"></i> COMPARTILHAR PDF</button>
        <button type="button" class="btn btn-danger" onclick="sairESalvar()"><i class="fa-solid fa-right-from-bracket"></i> SAIR E SALVAR</button>
    </div>
</div>

<script>
    // Offline Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
        });
    }

    let lancamentosSessao = [];

    function handlePasswordInput(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.value.length > 0) {
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        } else {
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        }
    }

    function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
    }

    function entrarNoApp() {
        const senha = document.getElementById('senhaAcesso').value;
        if (senha.trim() !== "") {
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('telaPrincipal').classList.remove('hidden');
            document.body.style.backgroundColor = "#e0e0e0"; // Muda fundo ao entrar
            document.getElementById('data').valueAsDate = new Date();
        } else {
            alert("Digite a senha do controlador.");
        }
    }

    function aplicarMascaraCPF(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 3) v = v.replace(/^(\d{3})(\d)/, "$1.$2");
        if (v.length > 6) v = v.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
        if (v.length > 9) v = v.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
        input.value = v;
    }

    function buscarVeiculoPorPlaca() {
        const placa = document.getElementById('placa').value.toUpperCase().replace("-", "");
        const frota = {
            "ABC1234": { modelo: "Volvo FH 540", ano: "2021" },
            "WMX2026": { modelo: "Hilux 4x4", ano: "2023" }
        };
        if (frota[placa]) {
            document.getElementById('modeloVeiculo').value = frota[placa].modelo;
            document.getElementById('anoVeiculo').value = frota[placa].ano;
        }
    }

    function calcularTotal() {
        const q = parseFloat(document.getElementById('quantidade').value) || 0;
        const u = parseFloat(document.getElementById('valorUnitario').value) || 0;
        document.getElementById('valorTotal').value = (q * u).toFixed(2);
    }

    function verificarTipoItem() {
        const tipo = document.getElementById('tipoItem').value;
        const div = document.getElementById('divDescricaoPeca');
        const txt = document.getElementById('descricaoPeca');
        if (tipo === 'AUTOPECAS') {
            div.classList.remove('hidden');
            txt.required = true;
        } else {
            div.classList.add('hidden');
            txt.required = false;
        }
    }

    function validarESalvar() {
        const form = document.getElementById('formLançamento');
        const obrigatorios = form.querySelectorAll('[required]');
        let valido = true;

        obrigatorios.forEach(input => {
            if (!input.value.trim() || (input.type === "file" && input.files.length === 0)) {
                input.classList.add('erro-piscar');
                valido = false;
                input.onclick = () => input.classList.remove('erro-piscar');
            } else {
                input.classList.remove('erro-piscar');
            }
        });

        if (!valido) {
            alert("Preencha os itens obrigatórios piscando em vermelho!");
            return;
        }

        const dados = {
            placa: document.getElementById('placa').value,
            motorista: document.getElementById('nomeMotorista').value,
            item: document.getElementById('tipoItem').value,
            total: document.getElementById('valorTotal').value
        };

        lancamentosSessao.push(dados);
        alert("Salvo com sucesso!");
        
        // Limpeza para evitar duplicidade
        ["tipoItem", "quantidade", "valorUnitario", "valorTotal", "cupomFiscal", "hodometro", "fotoHodo", "fotoCupom"].forEach(id => {
            document.getElementById(id).value = "";
        });
        verificarTipoItem();
    }

    function verLancamentos() {
        if (lancamentosSessao.length === 0) return alert("Nenhum registro.");
        let txt = "SESSÃO ATUAL:\n\n";
        lancamentosSessao.forEach((d, i) => txt += `${i+1}. ${d.placa} | ${d.motorista} | R$ ${d.total}\n`);
        alert(txt);
    }

    function gerarPDF() {
        const el = document.getElementById('areaExportacao');
        const btns = el.querySelectorAll('button');
        btns.forEach(b => b.style.display = 'none');
        html2pdf().from(el).save().then(() => btns.forEach(b => b.style.display = 'block'));
    }

    function sairESalvar() {
        if(confirm("Deseja sair?")) {
            document.getElementById('senhaAcesso').value = "";
            document.getElementById('telaPrincipal').classList.add('hidden');
            document.getElementById('telaLogin').classList.remove('hidden');
            document.body.style.backgroundColor = "#000000";
        }
    }
</script>

</body>
</html>
